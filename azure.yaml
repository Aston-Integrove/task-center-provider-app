# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: tc-provider
metadata:
  template: tc-provider@0.1.0

services:
  api:
    project: ./src/Tcp.Api
    language: dotnet
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ../..
      remoteBuild: true

hooks:
  # Hooks are PowerShell 7 (pwsh) so the same scripts run on Windows, macOS, Linux and GitHub runners.
  preprovision:
    shell: pwsh
    run: infra/hooks/preprovision.ps1
  postprovision:
    shell: pwsh
    run: infra/hooks/postprovision.ps1
